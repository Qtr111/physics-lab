<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>杨氏双缝干涉</title>
    <style>
        :root { 
            --bg-color: #2c3e50; 
            --panel-bg: rgba(255, 255, 255, 0.1); 
            --accent-color: #00ffcc; 
            --text-main: #ecf0f1; 
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: "Segoe UI", Tahoma, sans-serif; 
            display: flex; height: 100vh; margin: 0; overflow: hidden; 
        }
        
        /* 主舞台 - 浅色渐变背景增加层次感 */
        .main-stage { 
            flex: 1; position: relative; display: flex; flex-direction: column; padding: 20px; 
            background: radial-gradient(circle at center, #34495e 0%, #2c3e50 100%);
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .formula-box { 
            background: var(--panel-bg); padding: 8px 20px; border-radius: 20px; 
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
            font-family: "Times New Roman", serif; font-size: 1.3rem; color: #00ffcc;
        }

        #canvas-container { 
            flex: 1; position: relative; background: #1a1a1a; border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; border: 2px solid #444;
        }
        canvas { width: 100%; height: 100%; }

        /* 右侧面板 - 玻璃拟态风格 */
        .side-panel { 
            width: 340px; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,0.1);
        }
        
        .panel-title { padding: 25px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); }

        .controls-content { padding: 25px; display: flex; flex-direction: column; gap: 35px; }
        .control-group { display: flex; flex-direction: column; gap: 12px; }
        .label-row { display: flex; justify-content: space-between; font-size: 14px; opacity: 0.9; }
        .val-text { color: var(--accent-color); font-family: monospace; font-size: 1.1rem; }

        input[type=range] { appearance: none; width: 100%; height: 6px; background: #555; border-radius: 3px; outline: none; }
        input[type=range]::-webkit-slider-thumb { 
            appearance: none; width: 20px; height: 20px; background: #fff; 
            border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px var(--accent-color);
        }

        button { 
            background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); 
            padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        button:hover { background: var(--accent-color); color: #000; }
    </style>
</head>
<body>

    <div class="main-stage">
        <div class="header">
            <h2 style="margin:0; letter-spacing: 1px;">杨氏双缝干涉实验室</h2>
            <div class="formula-box">Δx = (L/d) · λ</div>
        </div>
        
        <div id="canvas-container">
            <canvas id="mainCanvas"></canvas>
        </div>
    </div>

    <div class="side-panel">
        <div class="panel-title">光学校准控制</div>
        
        <div class="controls-content">
            <div class="control-group">
                <div class="label-row"><span>波长 (Wavelength)</span><span id="txt-lambda" class="val-text">550 nm</span></div>
                <input type="range" id="input-lambda" min="400" max="750" value="550">
            </div>

            <div class="control-group">
                <div class="label-row"><span>双缝间距 (Slit Distance)</span><span id="txt-d" class="val-text">0.20 mm</span></div>
                <input type="range" id="input-d" min="0.10" max="0.80" step="0.01" value="0.20">
            </div>

            <div class="control-group">
                <div class="label-row"><span>观察屏距 (Distance L)</span><span id="txt-L" class="val-text">1.50 m</span></div>
                <input type="range" id="input-L" min="0.5" max="5.0" step="0.1" value="1.5">
            </div>

            <button onclick="resetParams()">初始化实验装置</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    let params = { lambda: 550, d: 0.2, L: 1.5 };

    function resize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function nmToRGB(wl) {
        let r, g, b;
        if (wl < 440) { r = -(wl - 440) / (440 - 380); g = 0; b = 1; }
        else if (wl < 490) { r = 0; g = (wl - 440) / (490 - 440); b = 1; }
        else if (wl < 510) { r = 0; g = 1; b = -(wl - 510) / (510 - 490); }
        else if (wl < 580) { r = (wl - 510) / (580 - 510); g = 1; b = 0; }
        else if (wl < 645) { r = 1; g = -(wl - 645) / (645 - 580); b = 0; }
        else { r = 1; g = 0; b = 0; }
        return { r: Math.round(r * 255), g: Math.round(g * 255), b: Math.round(b * 255) };
    }

    function draw() {
        // 背景微弱渐变
        const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, 0);
        bgGrad.addColorStop(0, '#1a1a1a');
        bgGrad.addColorStop(1, '#0a0a0a');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const colorObj = nmToRGB(params.lambda);
        const colorStr = `rgb(${colorObj.r}, ${colorObj.g}, ${colorObj.b})`;
        const centerY = canvas.height / 2;
        
        // 1. 绘制手电筒 (Flashlight)
        const lightX = 40;
        ctx.save();
        // 手电筒身体
        ctx.fillStyle = '#444';
        ctx.beginPath();
        ctx.roundRect(lightX - 30, centerY - 15, 40, 30, 4);
        ctx.fill();
        // 手电筒灯头
        ctx.fillStyle = '#666';
        ctx.beginPath();
        ctx.moveTo(lightX + 10, centerY - 20);
        ctx.lineTo(lightX + 25, centerY - 25);
        ctx.lineTo(lightX + 25, centerY + 25);
        ctx.lineTo(lightX + 10, centerY + 20);
        ctx.fill();
        // 发光镜片
        ctx.fillStyle = colorStr;
        ctx.shadowBlur = 15;
        ctx.shadowColor = colorStr;
        ctx.fillRect(lightX + 25, centerY - 22, 5, 44);
        ctx.restore();

        // 2. 手电筒发出的预备光束
        const slitX = 140;
        const beamGrad = ctx.createLinearGradient(lightX + 30, 0, slitX, 0);
        beamGrad.addColorStop(0, `rgba(${colorObj.r}, ${colorObj.g}, ${colorObj.b}, 0.6)`);
        beamGrad.addColorStop(1, `rgba(${colorObj.r}, ${colorObj.g}, ${colorObj.b}, 0.1)`);
        ctx.fillStyle = beamGrad;
        ctx.beginPath();
        ctx.moveTo(lightX + 30, centerY - 22);
        ctx.lineTo(slitX, centerY - 80);
        ctx.lineTo(slitX, centerY + 80);
        ctx.lineTo(lightX + 30, centerY + 22);
        ctx.fill();

        // 3. 动态屏幕位置
        const minScreenX = slitX + 150;
        const maxScreenX = canvas.width - 100;
        const screenX = minScreenX + (params.L - 0.5) / 4.5 * (maxScreenX - minScreenX);
        const dScale = params.d * 150; 

        // 4. 绘制波纹 (半圆动画增加亮度和密度)
        const time = (Date.now() * 0.04) % 40;
        [centerY - dScale, centerY + dScale].forEach(y => {
            // 双缝挡板
            ctx.fillStyle = '#888';
            ctx.fillRect(slitX - 3, y - 8, 6, 16);
            
            ctx.save();
            ctx.beginPath();
            ctx.rect(slitX, 0, screenX - slitX, canvas.height);
            ctx.clip();
            
            ctx.strokeStyle = colorStr;
            const maxRadius = screenX - slitX + 50; 
            for(let r = time; r < maxRadius; r += 35) {
                // 优化能见度：让近处更亮，远处渐隐
                const alpha = Math.max(0, 0.6 * (1 - r / maxRadius));
                ctx.globalAlpha = alpha;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(slitX, y, r, -Math.PI/2, Math.PI/2);
                ctx.stroke();
            }
            ctx.restore();
        });

        // 5. 绘制观察屏 (干涉条纹)
        ctx.globalAlpha = 1;
        const screenW = 60;
        const imageData = ctx.createImageData(screenW, canvas.height);
        const period = (params.L / params.d) * (params.lambda / 450) * 15;

        for (let y = 0; y < canvas.height; y++) {
            const intensity = Math.pow(Math.cos(Math.PI * (y - centerY) / period), 2);
            for (let x = 0; x < screenW; x++) {
                const idx = (y * screenW + x) * 4;
                imageData.data[idx] = colorObj.r * intensity;
                imageData.data[idx + 1] = colorObj.g * intensity;
                imageData.data[idx + 2] = colorObj.b * intensity;
                imageData.data[idx + 3] = 255;
            }
        }
        ctx.putImageData(imageData, screenX, 0);
        
        // 屏边框与发光效果
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.strokeRect(screenX, 0, screenW, canvas.height);
        ctx.shadowBlur = 0;

        requestAnimationFrame(draw);
    }

    // 事件控制
    const inputLmb = document.getElementById('input-lambda');
    const inputD = document.getElementById('input-d');
    const inputL = document.getElementById('input-L');

    inputLmb.oninput = (e) => {
        params.lambda = e.target.value;
        document.getElementById('txt-lambda').innerText = params.lambda + " nm";
    };
    inputD.oninput = (e) => {
        params.d = e.target.value;
        document.getElementById('txt-d').innerText = parseFloat(params.d).toFixed(2) + " mm";
    };
    inputL.oninput = (e) => {
        params.L = e.target.value;
        document.getElementById('txt-L').innerText = parseFloat(params.L).toFixed(2) + " m";
    };

    function resetParams() {
        params = { lambda: 550, d: 0.20, L: 1.5 };
        inputLmb.value = 550; inputD.value = 0.20; inputL.value = 1.5;
        document.getElementById('txt-lambda').innerText = "550 nm";
        document.getElementById('txt-d').innerText = "0.20 mm";
        document.getElementById('txt-L').innerText = "1.50 m";
    }

    draw();
</script>
