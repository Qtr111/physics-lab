<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子衰变</title>
    <style>
        /* 保持 body 清洁，防止动态注入的智能体组件被 flex 布局污染破坏 */
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #f0f4fa;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100vw;
            color: #1e2f4e;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* 将原 body 的弹性居中布局安全地转移到独立视口容器中 */
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            min-height: 100vh;
        }

        .main-box {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 28px 30px;
            box-shadow: 0 20px 40px rgba(0,20,50,0.15);
            border: 1px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { 
            text-align: center; 
            color: #0b4b5e; 
            margin-top: 0; 
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }
        canvas {
            display: block;
            margin: 10px auto 20px;
            background: #ffffff;
            border-radius: 20px;
            border: 3px solid #1e3f5c;
            width: 100%;
            height: auto;
            box-shadow: 0 6px 0 #0f2a3b;
        }
        .control-panel {
            display: flex;
            justify-content: space-between;
            background: #e6edf5;
            padding: 20px 25px;
            border-radius: 20px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            border: 1px solid #b0c8d9;
            width: 100%;
        }
        .control-group {
            display: flex;
            gap: 30px;
            align-items: center;
            flex-wrap: wrap;
        }
        .radio-tile {
            background: white;
            padding: 10px 18px;
            border-radius: 40px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            border: 1px solid #9fb7cc;
        }
        .radio-tile input {
            margin-right: 6px;
            accent-color: #1f6e8c;
            transform: scale(1.1);
        }
        .btn-group {
            display: flex; 
            gap: 16px; 
            justify-content: center;
            margin-top: 5px;
        }
        .btn {
            padding: 12px 32px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.1s ease;
            box-shadow: 0 4px 0 #1a2c3d;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .btn-start { 
            background: #1f8b4c; 
            color: white; 
            box-shadow: 0 6px 0 #0e4726;
        }
        .btn-reset { 
            background: #4a636e; 
            color: white; 
            box-shadow: 0 6px 0 #2d3e46;
        }
        .btn:hover { 
            opacity: 0.9; 
            transform: translateY(2px);
            box-shadow: 0 4px 0 #1a2c3d;
        }

        /* 🤖 Dify 智能体样式强制保护，确保其在右下角完美浮动显现 */
        #dify-chatbot-bubble-button {
            background-color: #1f6e8c !important; /* 配合本实验主题的偏蓝色调 */
            position: fixed !important;
            bottom: 20px !important;
            right: 20px !important;
            z-index: 999999 !important;
        }
        #dify-chatbot-bubble-window {
            position: fixed !important;
            bottom: 90px !important;
            right: 20px !important;
            z-index: 999999 !important;
        }
    </style>

    <script>
        window.difyChatbotConfig = {
            token: 'tq9kTBjTtodbaZvA',
            inputs: {
                current_exp: "衰变"
            },
            systemVariables: {
                user_id: "exp_nuclear_decay" // 设立独立的对话隔离标识
            },
            userVariables: {}
        };
    </script>
</head>
<body>

<div class="app-container">
    <div class="main-box">
        <h2>⚛️ 磁场偏转 · 大圆居中</h2>
        
        <div class="control-panel">
            <div class="control-group">
                <div class="radio-tile">
                    <strong style="font-size:1.1rem;">🧲 磁场方向</strong><br>
                    <input type="radio" id="fieldIn" name="magField" value="in" checked>
                    <label for="fieldIn"><span style="font-size:1.6rem; font-weight:900; color:#1f5090;">×</span> 向里</label>
                    <input type="radio" id="fieldOut" name="magField" value="out" style="margin-left:15px;">
                    <label for="fieldOut"><span style="font-size:1.9rem; font-weight:900; color:#1f5090;">·</span> 向外</label>
                </div>
                <div class="radio-tile">
                    <strong style="font-size:1.1rem;">☢️ 衰变类型</strong><br>
                    <input type="radio" id="decayAlpha" name="decay" value="alpha" checked>
                    <label for="decayAlpha">α 衰变 (外切)</label>
                    <input type="radio" id="decayBeta" name="decay" value="beta" style="margin-left:15px;">
                    <label for="decayBeta">β⁻ 衰变 (内切)</label>
                </div>
            </div>
            <div class="btn-group">
                <button id="startBtn" class="btn btn-start">▶ 开始运动</button>
                <button id="resetBtn" class="btn btn-reset">↺ 重置</button>
            </div>
        </div>

        <canvas id="canvas" width="1000" height="600"></canvas>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        let isAnimating = false;
        let magneticDir = 'in';       
        let decayType = 'alpha';

        const K = 0.0022;
        const BIG_RADIUS = 160;       
        const ALPHA_SMALL_R = 35;     
        const BETA_SMALL_R = 22;      
        
        let particles = [];

        function initSimulation() {
            particles = [];
            const B_sign = (magneticDir === 'in') ? -1 : 1;

            if (decayType === 'alpha') {
                createAlphaParticleCenter('α',  +2, '#c93a3a', +1, B_sign, BIG_RADIUS);
                createSmallParticleOuter('X', +4, '#d4a02b', -1, B_sign, ALPHA_SMALL_R, BIG_RADIUS);
            } else {
                createBetaParticleCenter('β⁻', -1, '#2a7faa', +1, B_sign, BIG_RADIUS);
                createSmallParticleInner('X⁺', +5, '#c07a3a', -1, B_sign, BETA_SMALL_R, BIG_RADIUS);
            }
            draw();
        }

        function createAlphaParticleCenter(label, q, color, dir, B_sign, R) {
            const omega = q * B_sign * K;
            const cx = centerX;
            const cy = centerY;
            const initAngle = 0; 
            
            particles.push({
                label, q, color, R: R, omega: omega, cx: cx, cy: cy,
                angle: initAngle, initialAngle: initAngle, dir: dir, speedScale: 1.3, isBig: true
            });
        }

        function createBetaParticleCenter(label, q, color, dir, B_sign, R) {
            const omega = q * B_sign * K;
            const cx = centerX;
            const cy = centerY;
            const initAngle = 0;
            
            particles.push({
                label, q, color, R: R, omega: omega, cx: cx, cy: cy,
                angle: initAngle, initialAngle: initAngle, dir: dir, speedScale: 1.3, isBig: true
            });
        }

        function createSmallParticleOuter(label, q, color, dir, B_sign, smallR, bigR) {
            const omega = q * B_sign * K;
            const cx = centerX + bigR + smallR;
            const cy = centerY;  
            const dx = (centerX + bigR) - cx;  
            const dy = centerY - cy;           
            let initAngle = Math.atan2(dy, dx);
            
            particles.push({
                label, q, color, R: smallR, omega: omega, cx: cx, cy: cy,
                angle: initAngle, initialAngle: initAngle, dir: dir, speedScale: 1.3, isBig: false
            });
        }

        function createSmallParticleInner(label, q, color, dir, B_sign, smallR, bigR) {
            const omega = q * B_sign * K;
            const cx = centerX + bigR - smallR;
            const cy = centerY;
            const dx = (centerX + bigR) - cx;  
            const dy = centerY - cy;           
            let initAngle = Math.atan2(dy, dx);
            
            particles.push({
                label, q, color, R: smallR, omega: omega, cx: cx, cy: cy,
                angle: initAngle, initialAngle: initAngle, dir: dir, speedScale: 1.3, isBig: false
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.font = "bold 32px 'Segoe UI', 'Arial Black', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            for(let i=50; i<canvas.width; i+=80) {
                for(let j=50; j<canvas.height; j+=80) {
                    if (magneticDir === 'in') {
                        ctx.fillStyle = "#2c4c6b"; ctx.fillText("×", i, j);
                        ctx.fillStyle = "#1f3a57"; ctx.fillText("×", i-1, j-1);
                        ctx.fillStyle = "#3c647e"; ctx.fillText("×", i, j);
                    } else {
                        ctx.fillStyle = "#2c5e6b"; ctx.font = "bold 36px 'Segoe UI', 'Arial Black'"; ctx.fillText("·", i, j);
                        ctx.fillStyle = "#1e4752"; ctx.fillText("·", i-1, j-2);
                        ctx.fillStyle = "#367a8c"; ctx.fillText("·", i, j);
                    }
                }
            }
            ctx.font = "14px 'Segoe UI'";

            const decayX = centerX + BIG_RADIUS;
            const decayY = centerY;
            
            ctx.shadowBlur = 8; ctx.shadowColor = "rgba(0,0,0,0.2)";
            ctx.fillStyle = "#0f2a3f"; ctx.beginPath(); ctx.arc(decayX, decayY, 6, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0; ctx.fillStyle = "#f9fbfd"; ctx.beginPath(); ctx.arc(decayX, decayY, 3, 0, Math.PI * 2); ctx.fill();

            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.cx, p.cy, p.R, 0, Math.PI * 2);
                ctx.strokeStyle = p.color + '80';
                ctx.setLineDash([8, 10]);
                ctx.lineWidth = 3.0;
                ctx.stroke();
                ctx.setLineDash([]);

                const x = p.cx + p.R * Math.cos(p.angle);
                const y = p.cy + p.R * Math.sin(p.angle);

                ctx.shadowBlur = 12; ctx.shadowColor = "rgba(0,0,0,0.25)";
                ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = "#1a293b"; ctx.font = "bold 15px 'Segoe UI', Arial";
                ctx.fillText(p.label, x + 16, y - 18);
                
                let velAngle;
                if (p.omega > 0) velAngle = p.angle + Math.PI/2;
                else velAngle = p.angle - Math.PI/2;
                
                const arrowLen = 24;
                const arrowX = x + arrowLen * Math.cos(velAngle);
                const arrowY = y + arrowLen * Math.sin(velAngle);
                
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(arrowX, arrowY); ctx.strokeStyle = "#000000"; ctx.lineWidth = 3.0; ctx.stroke();
                
                ctx.fillStyle = "#000000"; ctx.beginPath(); ctx.moveTo(arrowX, arrowY);
                ctx.lineTo(arrowX - 8 * Math.cos(velAngle - 0.4), arrowY - 8 * Math.sin(velAngle - 0.4));
                ctx.lineTo(arrowX - 8 * Math.cos(velAngle + 0.4), arrowY - 8 * Math.sin(velAngle + 0.4));
                ctx.closePath(); ctx.fill();
            });
        }

        function update() {
            if (!isAnimating) return;
            particles.forEach(p => { p.angle += p.omega; });
            draw();
            requestAnimationFrame(update);
        }

        document.getElementById('startBtn').onclick = () => { isAnimating = true; update(); };
        document.getElementById('resetBtn').onclick = () => { isAnimating = false; initSimulation(); };
        
        document.getElementsByName('magField').forEach(r => {
            r.onchange = (e) => { magneticDir = e.target.value; initSimulation(); };
        });
        document.getElementsByName('decay').forEach(r => {
            r.onchange = (e) => { decayType = e.target.value; initSimulation(); };
        });

        initSimulation();
    })();
</script>

<script src="https://udify.app/embed.min.js" id="tq9kTBjTtodbaZvA" defer></script>

</body>
</html>
