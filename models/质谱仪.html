<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>质谱仪</title>
    <style>
        :root {
            --bg-dark: #05050a;
            --panel-bg: rgba(20, 20, 35, 0.95);
            --accent-purple: #bf36ff; 
            --accent-blue: #00f2ff;   
            --text-light: #f0f0f5;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            background-color: var(--bg-dark); 
            background-image: radial-gradient(circle at center, #101025 0%, #05050a 100%);
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; font-family: "Segoe UI", sans-serif; color: var(--text-light);
        }

        #app-container { 
            width: 1200px; height: 900px; background-color: #000; 
            border: 1px solid var(--glass-border); position: relative; 
            display: flex; overflow: hidden; border-radius: 16px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
        }
        
        #sim-canvas { background-color: #000; flex-shrink: 0; }

        #control-panel { 
            flex-grow: 1; background: var(--panel-bg); backdrop-filter: blur(20px);
            border-left: 1px solid var(--glass-border); padding: 30px 20px; 
            display: flex; flex-direction: column; overflow-y: auto;
        }

        h4 { color: var(--accent-purple); margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; }

        .particle-item { 
            background: rgba(255, 255, 255, 0.03); padding: 15px; 
            margin-bottom: 15px; border-radius: 10px; position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-group { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; }
        .input-group label { width: 95px; color: #999; }
        .input-group input { 
            background: #000; border: 1px solid #333; color: var(--accent-blue);
            padding: 5px; border-radius: 4px; width: 65px; text-align: center;
        }
        
        .remove-btn { position: absolute; right: 10px; top: 10px; color: #ff4d4d; border: none; background: none; cursor: pointer; font-size: 20px; }

        .btn-group { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
        button { padding: 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        
        #btn-add { background: rgba(0, 242, 255, 0.1); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        #btn-run { background: linear-gradient(45deg, #7b2ff7, #bf36ff); color: white; box-shadow: 0 4px 15px rgba(191, 54, 255, 0.3); }
        #btn-reset { background: transparent; color: #666; border: 1px solid #333; }
    </style>
</head>
<body>

<div id="app-container">
    <canvas id="sim-canvas" width="850" height="900"></canvas>
    
    <div id="control-panel">
        <h4>粒子注入系统</h4>
        <div id="particle-configs"></div>
        <button id="btn-add">+ 增加实验样本</button>

        <div class="env-settings" style="margin-top:30px">
            <h4>环境场参数</h4>
            <div class="input-group">
                <label>加速电压 U:</label>
                <input type="number" id="U" value="250">
            </div>
            <div class="input-group">
                <label>磁感强度 B:</label>
                <input type="number" id="B" value="8">
            </div>
        </div>

        <div class="btn-group">
            <button id="btn-run">开始粒子加速</button>
            <button id="btn-reset">清空设备</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('sim-canvas');
    const ctx = canvas.getContext('2d');
    const particleContainer = document.getElementById('particle-configs');
    
    const SOURCE_LEFT = 60;   
    const SOURCE_X = 100;     
    const SLIT_X = 280;       
    const START_Y = 150;      
    const ACCEL_WIDTH = SOURCE_X - SOURCE_LEFT;

    let particleIdCounter = 0;
    let animationId = null;
    let particles = [];
    const colorPalette = ["#00f2ff", "#36ffb3", "#ffee00", "#ff3672", "#369dff"];

    function createParticleUI(m = 15, q = 1) { // 默认值修改为 m=15
        particleIdCounter++;
        const color = colorPalette[(particleIdCounter - 1) % colorPalette.length];
        const div = document.createElement('div');
        div.className = 'particle-item';
        div.style.borderLeft = `4px solid ${color}`;
        div.innerHTML = `
            <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
            <div class="input-group"><label>质量 (m):</label><input type="number" class="p-m" value="${m}"></div>
            <div class="input-group"><label>电荷 (q):</label><input type="number" class="p-q" value="${q}"></div>
            <input type="hidden" class="p-color" value="${color}">
        `;
        particleContainer.appendChild(div);
    }

    class Particle {
        constructor(m, q, color) {
            this.m = m;
            this.q = q;
            this.color = color;
            this.reset();
        }

        reset() {
            this.x = SOURCE_LEFT + 2; 
            this.y = START_Y;
            this.vx = 0;
            this.vy = 0;
            this.path = [];
            this.state = 'ACCEL'; 
        }

        update(dt, U, B) {
            if (this.state === 'DONE') return;
            const subSteps = 15; 
            const subDt = dt / subSteps;
            for(let i = 0; i < subSteps; i++) {
                if (this.state === 'ACCEL') {
                    const targetV = Math.sqrt((2 * this.q * U) / this.m) * 12;
                    const acceleration = (targetV * targetV) / (2 * ACCEL_WIDTH);
                    this.vx += acceleration * subDt;
                    this.x += this.vx * subDt;
                    if (this.x >= SOURCE_X) this.state = 'DRIFT';
                } else if (this.state === 'DRIFT') {
                    this.x += this.vx * subDt;
                    if (this.x >= SLIT_X) {
                        this.state = 'MAGNETIC';
                        this.x = SLIT_X;
                    }
                } else if (this.state === 'MAGNETIC') {
                    const v = Math.sqrt(this.vx**2 + this.vy**2);
                    const r = (this.m * v) / (this.q * B) * 2.5; 
                    const omega = v / r; 
                    const curAngle = Math.atan2(this.vy, this.vx);
                    const nextAngle = curAngle + omega * subDt;
                    this.vx = v * Math.cos(nextAngle);
                    this.vy = v * Math.sin(nextAngle);
                    this.x += this.vx * subDt;
                    this.y += this.vy * subDt;
                    if (this.vx < 0 && this.x <= SLIT_X) {
                        this.state = 'DONE';
                        this.x = SLIT_X;
                        break;
                    }
                }
                if (i % 3 === 0) this.path.push({x: this.x, y: this.y});
            }
            if (this.y > canvas.height || this.x > canvas.width || this.y < 0) this.state = 'DONE';
        }

        draw() {
            ctx.beginPath();
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 3;
            if (this.path.length > 0) {
                ctx.moveTo(this.path[0].x, this.path[0].y);
                for (let p of this.path) ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function drawStaticScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const boxX = SOURCE_LEFT;
        const boxY = START_Y - 40;
        const boxW = SOURCE_X - SOURCE_LEFT;
        const boxH = 80;
        ctx.save();
        ctx.fillStyle = "#111";
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeStyle = "#00f2ff";
        ctx.lineWidth = 2;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#00f2ff";
        ctx.strokeRect(boxX, boxY, boxW, boxH);
        ctx.restore();

        ctx.save();
        ctx.beginPath(); ctx.rect(boxX, boxY, boxW, boxH); ctx.clip();
        ctx.strokeStyle = "rgba(0, 242, 255, 0.3)";
        ctx.lineWidth = 1;
        for (let y = boxY + 15; y < boxY + boxH; y += 25) {
            ctx.beginPath(); ctx.moveTo(boxX, y); ctx.lineTo(boxX + boxW, y); ctx.stroke();
            ctx.fillStyle = "rgba(0, 242, 255, 0.6)";
            ctx.beginPath(); ctx.moveTo(boxX + 15, y - 3); ctx.lineTo(boxX + 22, y); ctx.lineTo(boxX + 15, y + 3); ctx.fill();
        }
        ctx.restore();

        const magneticColor = "rgba(191, 54, 255, 0.3)"; 
        for (let x = SLIT_X + 60; x < canvas.width; x += 80) {
            for (let y = 60; y < canvas.height; y += 80) {
                ctx.strokeStyle = magneticColor;
                ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fillStyle = magneticColor; ctx.fill();
            }
        }

        ctx.strokeStyle = "#222";
        ctx.lineWidth = 12;
        ctx.beginPath(); ctx.moveTo(SLIT_X, 0); ctx.lineTo(SLIT_X, START_Y - 20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(SLIT_X, START_Y + 20); ctx.lineTo(SLIT_X, canvas.height); ctx.stroke();

        ctx.strokeStyle = "#bf36ff";
        ctx.lineWidth = 4;
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#bf36ff";
        ctx.beginPath(); ctx.moveTo(SLIT_X + 5, 0); ctx.lineTo(SLIT_X + 5, canvas.height); ctx.stroke();
        ctx.shadowBlur = 0;
    }

    function startSimulation() {
        const U = parseFloat(document.getElementById('U').value);
        const B = parseFloat(document.getElementById('B').value);
        particles = [];
        document.querySelectorAll('.particle-item').forEach(item => {
            const m = parseFloat(item.querySelector('.p-m').value);
            const q = parseFloat(item.querySelector('.p-q').value);
            const color = item.querySelector('.p-color').value;
            if (!isNaN(m) && !isNaN(q)) particles.push(new Particle(m, q, color));
        });
        function runFrame() {
            drawStaticScene();
            let active = false;
            particles.forEach(p => {
                p.update(0.25, U, B); 
                p.draw();
                if (p.state !== 'DONE') active = true;
            });
            animationId = requestAnimationFrame(runFrame);
        }
        cancelAnimationFrame(animationId);
        runFrame();
    }

    document.getElementById('btn-add').addEventListener('click', () => createParticleUI());
    document.getElementById('btn-run').addEventListener('click', startSimulation);
    document.getElementById('btn-reset').addEventListener('click', () => {
        cancelAnimationFrame(animationId);
        particles = [];
        drawStaticScene();
    });

    // 仅初始化一个质量为15、电荷为1的粒子
    createParticleUI(15, 1);
    drawStaticScene();
</script>
</body>
</html>
