<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>速度选择器</title>
    <style>
        :root {
            --bg-dark: #020617;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --neon-blue: #38bdf8;
            --neon-green: #4ade80;
            --neon-red: #f87171;
            --text-main: #f1f5f9;
        }

        /* 修复核心：保持 body 清洁，避免动态注入的智能体变成 flex 子项 */
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: var(--text-main);
        }

        /* 将原先 body 的布局转移到独立的视口容器中 */
        .app-container {
            padding: 20px;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
        }

        .lab-wrapper {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            height: 90vh;
        }

        /* 侧边控制面板 */
        .side-panel {
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            letter-spacing: 2px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label-val {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .label-val span:last-child {
            color: var(--neon-blue);
            font-family: monospace;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--neon-blue);
            cursor: pointer;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-group label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-danger {
            background: transparent;
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.1);
            border-color: #f87171;
        }

        /* 主视口区域 */
        .stage-container {
            flex: 1;
            position: relative;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 🤖 优化后的 Dify 智能体样式强制保护 */
        #dify-chatbot-bubble-button {
            background-color: var(--neon-blue) !important;
            position: fixed !important;
            bottom: 20px !important;
            right: 20px !important;
            z-index: 999999 !important;
        }
        #dify-chatbot-bubble-window {
            position: fixed !important;
            bottom: 90px !important;
            right: 20px !important;
            z-index: 999999 !important;
        }
    </style>

    <script>
        window.difyChatbotConfig = {
            token: 'tq9kTBjTtodbaZvA',
            inputs: {
                current_exp: "速度选择器仿真模型（复合正交电磁场）"
            },
            systemVariables: {
                user_id: "exp_velocity_selector" // 设立独立的对话隔离标识
            },
            userVariables: {}
        };
    </script>
</head>
<body>

<div class="app-container">
    <div class="lab-wrapper">
        <div class="side-panel">
            <h2>速度选择器</h2>
            
            <div class="control-item">
                <div class="label-val">
                    <span>电场强度 (E)</span>
                    <span id="v-E">50</span>
                </div>
                <input type="range" id="sl-E" min="10" max="100" value="50">
            </div>

            <div class="control-item">
                <div class="label-val">
                    <span>磁感应强度 (B)</span>
                    <span id="v-B">25</span>
                </div>
                <input type="range" id="sl-B" min="10" max="100" value="25">
            </div>

            <div class="control-item">
                <div class="label-val">
                    <span>入射初速度 (v)</span>
                    <span id="v-v">40</span>
                </div>
                <input type="range" id="sl-v" min="10" max="80" value="40">
            </div>

            <div class="control-item">
                <div class="label-val"><span>粒子电性</span></div>
                <div class="radio-group">
                    <label><input type="radio" name="charge" value="1" checked><span style="color:var(--neon-red)">正电荷</span></label>
                    <label><input type="radio" name="charge" value="-1"><span style="color:var(--neon-blue)">负电荷</span></label>
                </div>
            </div>

            <div class="btn-stack">
                <button id="btn-fire" class="btn-primary">🚀 单次发射</button>
                <button id="btn-stream" class="btn-secondary">🌊 粒子束连续发射</button>
                <button id="btn-scatter" class="btn-secondary">💥 喷射发散粒子束</button>
                <button id="btn-clear" class="btn-danger">🧹 擦除轨迹</button>
            </div>
        </div>

        <div class="stage-container" id="stage">
            <canvas id="labCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('labCanvas');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');

    // 适配高分辨率屏幕
    function resize() {
        canvas.width = stage.clientWidth;
        canvas.height = stage.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 核心物理参数配置
    const cfg = {
        topY: 150,
        bottomY: 450,
        gateX: 750,
        gateSize: 24,
        zoom: 0.16,          
        sensitivity: 0.85   
    };

    let particles = [];
    let isStreamActive = false;
    let streamTimer = null;

    // UI 绑定
    const bindSlider = (id, valId) => {
        const sl = document.getElementById(id);
        const v = document.getElementById(valId);
        sl.addEventListener('input', () => v.innerText = sl.value);
        return sl;
    };

    const slE = bindSlider('sl-E', 'v-E');
    const slB = bindSlider('sl-B', 'v-B');
    const slv = bindSlider('sl-v', 'v-v');

    function getSelectedCharge() {
        return parseFloat(document.querySelector('input[name="charge"]:checked').value);
    }

    class Particle {
        constructor(vx, q, customColor = null, side = 'left') {
            this.side = side; 
            this.x = this.side === 'left' ? 50 : canvas.width - 50;
            this.y = (cfg.topY + cfg.bottomY) / 2;
            this.vx = vx;
            this.vy = 0;
            this.q = q;
            this.m = 1.0; 
            this.active = true;
            this.history = [];
            this.color = customColor || (q > 0 ? varColor('--neon-red') : varColor('--neon-blue'));
        }

        update(dt, E, B) {
            if(!this.active) return;

            // 进入复合场区域
            const leftBound = 150;
            const rightBound = cfg.gateX;
            if(this.x >= leftBound && this.x <= rightBound) {
                // 经典洛伦兹力与电场力正交叠加运动学方程
                const realVx = this.side === 'left' ? this.vx : -this.vx;
                const ay = ((this.q * E - this.q * realVx * B) / this.m) * cfg.sensitivity;
                this.vy += ay * dt;
            }
            const dir = this.side === 'left' ? this.vx : -this.vx;
            this.x += dir * dt * cfg.zoom;
            this.y += this.vy * dt * cfg.zoom;
            this.history.push({x: this.x, y: this.y});

            // 越界与挡板碰撞判定
            if(this.y <= cfg.topY || this.y >= cfg.bottomY || this.x < 0 || p => this.x > canvas.width) {
                this.active = false;
            }

            // 右侧挡板物理隔离隔离判断
            if(this.side === 'left' && this.x >= cfg.gateX) {
                const midY = (cfg.topY + cfg.bottomY) / 2;
                if(Math.abs(this.y - midY) > cfg.gateSize / 2) {
                    this.active = false; 
                }
            }
        }

        draw() {
            if(this.history.length > 0) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 4;
                this.history.forEach((pos, i) => i === 0 ? ctx.moveTo(pos.x, pos.y) : ctx.lineTo(pos.x, pos.y));
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            ctx.arc(this.x, this.y, 9, 0, Math.PI*2);
            ctx.fillStyle = this.active ? '#ffffff' : this.color + '44';
            ctx.fill();
        }
    }

    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function drawScene() {
        // 绘制偏转极板几何形态
        ctx.fillStyle = 'rgba(51, 65, 85, 0.5)';
        ctx.fillRect(150, cfg.topY - 15, cfg.gateX - 150, 15);
        ctx.fillRect(150, cfg.bottomY, cfg.gateX - 150, 15);

        // 极板符号标识
        ctx.fillStyle = varColor('--neon-red');
        ctx.font = 'bold 16px sans-serif';
        for(let x = 180; x < cfg.gateX; x += 60) ctx.fillText('+', x, cfg.topY - 4);
        ctx.fillStyle = varColor('--neon-blue');
        for(let x = 180; x < cfg.gateX; x += 60) ctx.fillText('-', x, cfg.bottomY + 13);

        // 右侧狭缝挡板
        ctx.fillStyle = '#475569';
        const midY = (cfg.topY + cfg.bottomY) / 2;
        ctx.fillRect(cfg.gateX, cfg.topY, 15, midY - cfg.gateSize/2 - cfg.topY);
        ctx.fillRect(cfg.gateX, midY + cfg.gateSize/2, 15, cfg.bottomY - (midY + cfg.gateSize/2));

        // 磁场背景符号 (×) 动态平铺
        ctx.fillStyle = 'rgba(255,255,255,0.03)';
        ctx.font = '14px monospace';
        for(let lx = 170; lx < cfg.gateX; lx += 30) {
            for(let ly = cfg.topY + 20; ly < cfg.bottomY; ly += 30) {
                ctx.fillText('×', lx, ly);
            }
        }
    }

    // 引擎主循环
    let lastTime = performance.now();
    function loop(now) {
        const dt = Math.min(now - lastTime, 30);
        lastTime = now;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawScene();

        const currentE = parseFloat(slE.value);
        const currentB = parseFloat(slB.value);

        particles.forEach(p => {
            p.update(dt, currentE, currentB);
            p.draw();
        });

        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // 交互动作控制
    document.getElementById('btn-fire').onclick = () => {
        particles.push(new Particle(parseFloat(slv.value), getSelectedCharge()));
    };

    const streamBtn = document.getElementById('btn-stream');
    streamBtn.onclick = () => {
        isStreamActive = !isStreamActive;
        if(isStreamActive) {
            streamBtn.innerText = '🛑 停止连续发射';
            streamBtn.style.background = 'linear-gradient(135deg, #b45309 0%, #92400e 100%)';
            streamTimer = setInterval(() => {
                particles.push(new Particle(parseFloat(slv.value), getSelectedCharge()));
            }, 200);
        } else {
            streamBtn.innerText = '🌊 粒子束连续发射';
            streamBtn.style.background = 'rgba(255, 255, 255, 0.05)';
            clearInterval(streamTimer);
        }
    };

    document.getElementById('btn-scatter').onclick = () => {
        const centerV = parseFloat(slv.value);
        const q = getSelectedCharge();
        // 一键高斯扩散或线性排布发射多条不同速度粒子
        for(let i = -4; i <= 4; i++) {
            const spreadV = centerV + i * 6;
            if(spreadV > 0) {
                let color = null;
                if(i === 0) color = '#facc15'; // 完美准直中心速度黄色高亮
                particles.push(new Particle(spreadV, q, color));
            }
        }
    };

    document.getElementById('btn-clear').onclick = () => particles = [];
</script>

<script src="https://udify.app/embed.min.js" id="tq9kTBjTtodbaZvA" defer></script>

</body>
</html>
