<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>带电粒子在匀强磁场中的运动 </title>
    <style>
        :root { 
            --accent: #3b82f6; 
            --neon: #60a5fa;
            --bg: #0f172a; 
            --panel: rgba(30, 41, 59, 0.7); 
            --border: rgba(148, 163, 184, 0.2);
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 0; 
            color: #f1f5f9; 
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
        .main-wrapper { 
            display: flex; 
            gap: 25px; 
            background: var(--panel); 
            backdrop-filter: blur(12px);
            padding: 24px; 
            border-radius: 28px; 
            border: 1px solid var(--border);
            box-shadow: 0 0 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(59, 130, 246, 0.1);
            max-height: 98vh;
        }
        /* 左侧控制面板 */
        .sidebar { 
            width: 280px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px;
        }
        h2 { 
            margin: 0; 
            font-size: 1.2rem; 
            letter-spacing: 1px;
            text-transform: uppercase;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
        }
        .control-group { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            background: rgba(15, 23, 42, 0.5);
            padding: 14px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        label { font-weight: 600; font-size: 12px; color: #94a3b8; display: flex; justify-content: space-between; text-transform: uppercase; }
        
        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #1e293b;
            font-size: 14px;
            color: #f1f5f9;
            cursor: pointer;
            outline: none;
        }

        /* 科技感滑动条 */
        input[type="range"] { 
            width: 100%; cursor: pointer; height: 4px; border-radius: 2px; appearance: none; background: #334155; 
        }
        input[type="range"]::-webkit-slider-thumb { 
            appearance: none; width: 18px; height: 18px; background: var(--accent); border-radius: 4px; 
            cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 10px var(--accent); 
        }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        button { 
            width: 100%; padding: 12px; border: none; border-radius: 12px; 
            font-weight: bold; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            font-size: 14px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        #fireBtn { 
            background: var(--accent); 
            color: white; 
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        #fireBtn:hover { 
            background: #2563eb; 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }
        #fireBtn:active { transform: translateY(0); }

        #clearBtn { background: transparent; color: #94a3b8; border: 1px solid var(--border); }
        #clearBtn:hover { background: rgba(226, 232, 240, 0.1); color: #f1f5f9; }
        
        /* 预设按钮 */
        .preset-btn { 
            background: rgba(59, 130, 246, 0.1); 
            color: var(--neon); 
            border: 1px solid rgba(59, 130, 246, 0.3); 
            padding: 8px; 
            font-size: 12px; 
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        .preset-btn::after {
            content: '>'; position: absolute; right: 10px; opacity: 0.5;
        }
        .preset-btn:hover { 
            background: rgba(59, 130, 246, 0.2); 
            border-color: var(--accent);
            padding-left: 12px;
        }
        
        .val-display { color: var(--neon); font-family: 'Consolas', monospace; text-shadow: 0 0 8px rgba(96, 165, 250, 0.5); }
        
        /* 画布容器装饰 */
        .canvas-container { position: relative; }
        .canvas-container::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--accent), transparent, var(--accent));
            border-radius: 18px; z-index: -1; opacity: 0.3;
        }
        
        canvas { 
            background: #020617; 
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px; 
            display: block; 
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="sidebar">
        <h2>控制面板<br><span style="color:var(--accent);" id="modeTitle">SYSTEM ACTIVE</span></h2>
        
        <div class="control-group">
            <label>磁场形状</label>
            <select id="shapeSelect">
                <option value="circle">圆形磁场 </option>
                <option value="rect">矩形磁场</option>
            </select>
        </div>

        <div class="control-group">
            <label>快捷参数预设</label>
            <div id="presetArea" class="btn-group"></div>
        </div>

        <div class="control-group">
            <label>初速度 (v): <span class="val-display" id="vLabel">30</span></label>
            <input type="range" id="vInput" min="5" max="60" step="0.5" value="30">
        </div>
        
        <div class="control-group">
            <label>入射角 (θ): <span class="val-display" id="aLabel">0°</span></label>
            <input type="range" id="aInput" min="-90" max="90" value="0">
        </div>
        
        <div class="btn-group">
            <button id="fireBtn">发射粒子 (Enter)</button>
            <button id="clearBtn">清空画布</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="mainCanvas" width="900" height="900"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    
    const env = {
        mode: 'circle',
        fieldCenterX: 450, 
        fieldCenterY: 450,
        fieldR: 400,
        rectW: 400,
        rectH: 800,
        get originX() {
            return this.mode === 'circle' ? (this.fieldCenterX - this.fieldR) : 250;
        },
        get originY() {
            return this.fieldCenterY;
        },
        get rectRight() {
            return this.originX + this.rectW;
        }
    };

    let particles = [];
    const vInput = document.getElementById('vInput');
    const aInput = document.getElementById('aInput');
    const shapeSelect = document.getElementById('shapeSelect');
    const presetArea = document.getElementById('presetArea');

    const presets = {
        circle: [
            { label: "120° 偏转", v: 20, a: 0 },
            { label: "90° 偏转", v: 28, a: 0 },
            { label: "60° 偏转", v: 39, a: 0 }
        ],
        rect: [
            { label: "右边界相切 ", v: 18, a: -90 }
        ]
    };

    function updatePresets() {
        presetArea.innerHTML = '';
        const currentPresets = presets[env.mode];
        currentPresets.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'preset-btn';
            btn.textContent = p.label;
            btn.onclick = () => {
                vInput.value = p.v;
                aInput.value = p.a;
                document.getElementById('vLabel').textContent = p.v;
                document.getElementById('aLabel').textContent = p.a + "°";
                fireParticle();
            };
            presetArea.appendChild(btn);
        });
    }

    class Particle {
        constructor(v, angleDeg, mode) {
            this.v = v;
            this.mode = mode;
            this.angleRad = -angleDeg * Math.PI / 180;
            this.color = `hsl(${Math.random() * 360}, 100%, 65%)`; // 更亮的发光色
            this.R = (Math.pow(this.v, 2) / 3.0) + (this.v * 5); 
            this.centerX = env.originX + this.R * Math.sin(this.angleRad);
            this.centerY = env.originY - this.R * Math.cos(this.angleRad);
            this.startAngle = Math.atan2(env.originY - this.centerY, env.originX - this.centerX);
            this.currentAngle = this.startAngle;
            this.alive = true;
            this.path = [{x: env.originX, y: env.originY}];
        }

        update() {
            if (!this.alive) return;
            const deltaTheta = 0.012; 
            this.currentAngle -= deltaTheta;
            let nextX = this.centerX + this.R * Math.cos(this.currentAngle);
            let nextY = this.centerY + this.R * Math.sin(this.currentAngle);

            if (this.mode === 'circle') {
                const dist = Math.sqrt(Math.pow(nextX - env.fieldCenterX, 2) + Math.pow(nextY - env.fieldCenterY, 2));
                if (dist >= env.fieldR) {
                    const ang = Math.atan2(nextY - env.fieldCenterY, nextX - env.fieldCenterX);
                    nextX = env.fieldCenterX + Math.cos(ang) * env.fieldR;
                    nextY = env.fieldCenterY + Math.sin(ang) * env.fieldR;
                    this.alive = false;
                }
            } else {
                if (nextX >= env.rectRight) {
                    const dx = env.rectRight - this.centerX;
                    const dy = Math.sqrt(Math.max(0, this.R**2 - dx**2));
                    nextY = (nextY > this.centerY) ? this.centerY + dy : this.centerY - dy;
                    nextX = env.rectRight;
                    this.alive = false;
                }
                if (nextX < env.originX - 2 || nextY < (env.fieldCenterY - env.rectH/2) || nextY > (env.fieldCenterY + env.rectH/2)) {
                    this.alive = false;
                }
            }
            this.path.push({x: nextX, y: nextY});
            if (this.path.length > 20 && Math.abs(nextX - env.originX) < 2 && Math.abs(nextY - env.originY) < 2) this.alive = false;
        }

        draw() {
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 3;
            ctx.moveTo(this.path[0].x, this.path[0].y);
            for (let i = 1; i < this.path.length; i++) ctx.lineTo(this.path[i].x, this.path[i].y);
            ctx.stroke();
            ctx.shadowBlur = 0; // 重置阴影，防止后续绘制模糊
            
            if (this.alive) {
                const last = this.path[this.path.length-1];
                ctx.beginPath(); ctx.arc(last.x, last.y, 4, 0, Math.PI*2);
                ctx.fillStyle = "#fff"; ctx.fill();
            }
        }
    }

    function drawArrow(ctx, fromx, fromy, tox, toy) {
        const headlen = 12;
        const angle = Math.atan2(toy - fromy, tox - fromx);
        ctx.beginPath(); ctx.moveTo(fromx, fromy); ctx.lineTo(tox, toy);
        ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tox, toy);
        ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
        ctx.closePath(); ctx.fillStyle = "#38bdf8"; ctx.fill();
    }

    function fireParticle() {
        particles.push(new Particle(parseFloat(vInput.value), parseFloat(aInput.value), env.mode));
    }

    function mainLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 绘制背景网格
        ctx.strokeStyle = "rgba(59, 130, 246, 0.05)";
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for(let j=0; j<canvas.height; j+=40) {
            ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
        }

        ctx.save();
        if (env.mode === 'circle') {
            ctx.beginPath(); ctx.arc(env.fieldCenterX, env.fieldCenterY, env.fieldR, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(30, 41, 59, 0.5)"; ctx.fill(); 
            ctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
            ctx.setLineDash([10, 5]); ctx.stroke(); ctx.clip(); 
        } else {
            const rectX = env.originX, rectY = env.fieldCenterY - env.rectH/2;
            ctx.fillStyle = "rgba(30, 41, 59, 0.5)";
            ctx.fillRect(rectX, rectY, env.rectW, env.rectH);
            ctx.strokeStyle = "rgba(56, 189, 248, 0.4)"; ctx.setLineDash([10, 5]);
            ctx.strokeRect(rectX, rectY, env.rectW, env.rectH);
            ctx.beginPath(); ctx.rect(rectX, rectY, env.rectW, env.rectH); ctx.clip();
        }
        // 磁场符号
        ctx.fillStyle = "rgba(148, 163, 184, 0.15)"; ctx.font = "14px monospace";
        for(let i=0; i<40; i++) for(let j=0; j<40; j++) ctx.fillText("×", 15 + i*30, 25 + j*30);
        ctx.restore();

        const v = parseFloat(vInput.value), ang = -parseFloat(aInput.value) * Math.PI / 180;
        const arrowLen = 40 + (v / 60) * 80;
        drawArrow(ctx, env.originX, env.originY, env.originX + arrowLen * Math.cos(ang), env.originY + arrowLen * Math.sin(ang));
        
        particles.forEach(p => { p.update(); p.draw(); });
        
        // 发射源高亮
        ctx.beginPath(); ctx.arc(env.originX, env.originY, 6, 0, Math.PI*2);
        ctx.fillStyle = "#3b82f6"; ctx.shadowBlur = 15; ctx.shadowColor = "#3b82f6";
        ctx.fill(); ctx.shadowBlur = 0;
        
        requestAnimationFrame(mainLoop);
    }

    shapeSelect.onchange = (e) => { env.mode = e.target.value; particles = []; updatePresets(); };
    document.getElementById('fireBtn').onclick = fireParticle;
    document.getElementById('clearBtn').onclick = () => { particles = []; };
    vInput.oninput = () => { document.getElementById('vLabel').textContent = vInput.value; };
    aInput.oninput = () => { document.getElementById('aLabel').textContent = aInput.value + "°"; };
    window.onkeydown = (e) => { if(e.key === "Enter") fireParticle(); };

    updatePresets();
    mainLoop();
</script>
</body>
</html>
