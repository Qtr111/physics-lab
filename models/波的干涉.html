<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机械波的干涉</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a2e;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }
        
        .container {
            width: 1200px;
            max-width: 95%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .canvas-container {
            position: relative;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
            background-color: #0a0e2a;
            height: 450px;
        }
        
        canvas {
            display: block;
            background-color: #0a0e2a;
            width: 100%;
            height: 100%;
        }
        
        .wave-source {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            z-index: 20;
            border: 2px solid white;
            box-shadow: 0 0 10px currentColor;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }
        
        #sourceLeft {
            left: 40px;
            top: 50%;
            background-color: #ff9f43;
            color: #ff9f43;
        }
        
        #sourceLeft::after {
            content: "左";
            color: white;
        }
        
        #sourceRight {
            right: 40px;
            top: 50%;
            background-color: #54a0ff;
            color: #54a0ff;
        }
        
        #sourceRight::after {
            content: "右";
            color: white;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .control-panel {
            flex: 1;
            min-width: 280px;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: white;
            text-align: center;
            font-weight: 500;
            font-size: 16px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
        }
        
        input[type="range"] {
            flex-grow: 1;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #2c3e50, #4a6491);
            outline: none;
            -webkit-appearance: none;
            margin-right: 10px;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
            border: 2px solid white;
        }
        
        #frequency::-webkit-slider-thumb {
            background: #9b59b6;
        }
        
        #waveSpeedSlider::-webkit-slider-thumb {
            background: #2ecc71;
        }
        
        #frameSlider::-webkit-slider-thumb {
            background: #f1c40f;
        }
        
        .value-display {
            width: 70px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            color: white;
            background: rgba(155, 89, 182, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        #waveSpeedValue {
            background: rgba(46, 204, 113, 0.3);
        }
        
        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        
        .direction-button-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        
        button {
            flex: 1;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "SimSun", "宋体", serif;
            white-space: nowrap;
            min-width: 110px;
            color: white !important;
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        #startLeftBtn {
            background-color: #ff9f43;
        }
        
        #startRightBtn {
            background-color: #54a0ff;
        }
        
        #startBothBtn {
            background-color: #9b59b6;
        }
        
        #toggleLeftWaveBtn {
            background-color: #f39c12;
        }
        
        #toggleRightWaveBtn {
            background-color: #3498db;
        }
        
        #toggleInterferenceBtn {
            background-color: #2ecc71;
        }
        
        #pauseBtn {
            background-color: #9b59b6;
        }
        
        #resetBtn {
            background-color: #e74c3c;
        }
        
        .direction-btn {
            background-color: #34495e;
            min-width: auto;
            padding: 8px 12px;
            font-size: 13px;
        }
        
        .direction-btn.up {
            background-color: #27ae60;
        }
        
        .direction-btn.down {
            background-color: #e74c3c;
        }
        
        .pause-reset-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .pause-reset-container button {
            min-width: 160px;
            padding: 12px 20px;
            font-size: 15px;
        }
        
        .frame-control {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .frame-control.active {
            display: block;
        }
        
        .frame-slider-container {
            display: flex;
            align-items: center;
        }
        
        .status {
            text-align: center;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 8px;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }
        
        .left-wave-legend {
            background-color: #ff9f43;
        }
        
        .right-wave-legend {
            background-color: #54a0ff;
        }
        
        .interference-legend {
            background-color: #2ecc71;
        }
        
        .wave-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        
        @media (max-width: 768px) {
            .wave-controls {
                grid-template-columns: 1fr;
            }
        }
        
        .parameter-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            .parameter-controls {
                grid-template-columns: 1fr;
            }
        }
        
        .direction-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            .direction-controls {
                grid-template-columns: 1fr;
            }
        }
        
        .simultaneous-control {
            margin-top: 15px;
        }
        
        .side-controls {
            position: absolute;
            top: 0;
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .left-side-controls {
            left: -200px;
        }
        
        .right-side-controls {
            right: -200px;
        }
        
        .side-control-panel {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .side-control-panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: white;
            text-align: center;
            font-weight: 500;
            font-size: 16px;
        }
        
        .side-button-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .side-button-container button {
            min-width: 100%;
            padding: 10px;
        }
        
        @media (max-width: 1400px) {
            .side-controls {
                position: static;
                width: 100%;
                margin-top: 15px;
            }
            
            .left-side-controls, .right-side-controls {
                position: static;
                width: 100%;
            }
        }
        
        .coordinate-axis {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.3);
            z-index: 5;
        }
        
        .axis-label {
            position: absolute;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            transform: translateX(-50%);
            bottom: -20px;
        }
        
        .axis-tick {
            position: absolute;
            height: 8px;
            width: 1px;
            background-color: rgba(255, 255, 255, 0.5);
            bottom: -4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="side-controls left-side-controls">
            <div class="side-control-panel">
                <h3>左波源控制</h3>
                <div class="side-button-container">
                    <button id="startLeftBtn">左波源起振</button>
                    <button id="toggleLeftWaveBtn">隐藏左侧波</button>
                    <div class="direction-button-container">
                        <button id="leftDirectionUpBtn" class="direction-btn up">向上起振</button>
                        <button id="leftDirectionDownBtn" class="direction-btn">向下起振</button>
                    </div>
                </div>
            </div>
            
            <div class="side-control-panel">
                <h3>左波源振幅</h3>
                <div class="control-group">
                    <label for="amplitudeLeftSlider">振幅 (像素)</label>
                    <div class="slider-container">
                        <input type="range" id="amplitudeLeftSlider" min="10" max="60" step="2" value="40">
                        <span id="amplitudeLeftValue" class="value-display">40</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="status" id="status">点击按钮开始模拟</div>
        
        <div class="canvas-container">
            <div class="coordinate-axis" id="coordinateAxis" style="top: 50%;"></div>
            <div class="wave-source" id="sourceLeft"></div>
            <div class="wave-source" id="sourceRight"></div>
            <canvas id="waveCanvas" width="1000" height="450"></canvas>
        </div>
        
        <div class="parameter-controls">
            <div class="control-panel">
                <h3>波参数控制</h3>
                <div class="control-group">
                    <label for="frequency">波频率 (Hz)</label>
                    <div class="slider-container">
                        <input type="range" id="frequency" min="0.2" max="0.3" step="0.01" value="0.25">
                        <span id="frequencyValue" class="value-display">0.25 Hz</span>
                    </div>
                </div>
                <div class="control-group">
                    <label for="waveSpeedSlider">波速 (像素/秒)</label>
                    <div class="slider-container">
                        <input type="range" id="waveSpeedSlider" min="50" max="65" step="1" value="58">
                        <span id="waveSpeedValue" class="value-display">58</span>
                    </div>
                </div>
            </div>
            
            <div class="control-panel">
                <h3>同时控制</h3>
                <div class="button-container">
                    <button id="startBothBtn">左右波源同时起振</button>
                </div>
                <div class="control-group" style="margin-top: 15px;">
                    <button id="toggleInterferenceBtn" style="width: 100%;">显示干涉波</button>
                </div>
            </div>
        </div>
        
        <div class="side-controls right-side-controls">
            <div class="side-control-panel">
                <h3>右波源控制</h3>
                <div class="side-button-container">
                    <button id="startRightBtn">右波源起振</button>
                    <button id="toggleRightWaveBtn">隐藏右侧波</button>
                    <div class="direction-button-container">
                        <button id="rightDirectionUpBtn" class="direction-btn up">向上起振</button>
                        <button id="rightDirectionDownBtn" class="direction-btn">向下起振</button>
                    </div>
                </div>
            </div>
            
            <div class="side-control-panel">
                <h3>右波源振幅</h3>
                <div class="control-group">
                    <label for="amplitudeRightSlider">振幅 (像素)</label>
                    <div class="slider-container">
                        <input type="range" id="amplitudeRightSlider" min="10" max="60" step="2" value="40">
                        <span id="amplitudeRightValue" class="value-display">40</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="frame-control" id="frameControl">
            <div class="frame-slider-container">
                <input type="range" id="frameSlider" min="0" max="10" step="0.01" value="0">
            </div>
        </div>
        
        <div class="pause-reset-container">
            <button id="pauseBtn">暂停动画</button>
            <button id="resetBtn">重置模拟</button>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color left-wave-legend"></div>
                <span>左波源波形 (橙色)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color right-wave-legend"></div>
                <span>右波源波形 (蓝色)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color interference-legend"></div>
                <span>干涉波形 (绿色)</span>
            </div>
        </div>
    </div>

    <script>
        // 获取Canvas元素和上下文
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        
        // 获取控制元素
        const sourceLeft = document.getElementById('sourceLeft');
        const sourceRight = document.getElementById('sourceRight');
        const frequencySlider = document.getElementById('frequency');
        const waveSpeedSlider = document.getElementById('waveSpeedSlider');
        const amplitudeLeftSlider = document.getElementById('amplitudeLeftSlider');
        const amplitudeRightSlider = document.getElementById('amplitudeRightSlider');
        const frequencyValue = document.getElementById('frequencyValue');
        const waveSpeedValue = document.getElementById('waveSpeedValue');
        const amplitudeLeftValue = document.getElementById('amplitudeLeftValue');
        const amplitudeRightValue = document.getElementById('amplitudeRightValue');
        
        // 按钮元素
        const startLeftBtn = document.getElementById('startLeftBtn');
        const startRightBtn = document.getElementById('startRightBtn');
        const startBothBtn = document.getElementById('startBothBtn');
        const toggleLeftWaveBtn = document.getElementById('toggleLeftWaveBtn');
        const toggleRightWaveBtn = document.getElementById('toggleRightWaveBtn');
        const toggleInterferenceBtn = document.getElementById('toggleInterferenceBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // 方向控制按钮
        const leftDirectionUpBtn = document.getElementById('leftDirectionUpBtn');
        const leftDirectionDownBtn = document.getElementById('leftDirectionDownBtn');
        const rightDirectionUpBtn = document.getElementById('rightDirectionUpBtn');
        const rightDirectionDownBtn = document.getElementById('rightDirectionDownBtn');
        
        // 帧控制元素
        const frameControl = document.getElementById('frameControl');
        const frameSlider = document.getElementById('frameSlider');
        
        const status = document.getElementById('status');
        const coordinateAxis = document.getElementById('coordinateAxis');
        
        // 物理参数
        let amplitudeLeft = parseFloat(amplitudeLeftSlider.value);
        let amplitudeRight = parseFloat(amplitudeRightSlider.value);
        let waveSpeed = parseFloat(waveSpeedSlider.value);
        const particleCount = 150;
        const leftSourceX = 50;
        const rightSourceX = canvas.width - 50;
        
        const particles = [];
        const particleSpacing = (canvas.width - 100) / (particleCount - 1);
        
        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: 50 + i * particleSpacing,
                originalY: canvas.height / 2
            });
        }
        
        let time = 0;
        let animationId;
        let leftWaveActive = false;
        let rightWaveActive = false;
        let leftStartTime = 0;
        let rightStartTime = 0;
        let frequency = parseFloat(frequencySlider.value);
        let isPaused = false;
        let showLeftWave = true;
        let showRightWave = true;
        let showInterference = false;
        let leftDirection = 1;
        let rightDirection = 1;
        let manualTime = 0;
        let maxTime = 10;
        
        function updateParameterDisplay() {
            frequencyValue.textContent = frequency.toFixed(2) + " Hz";
            waveSpeedValue.textContent = waveSpeed;
            amplitudeLeftValue.textContent = amplitudeLeft;
            amplitudeRightValue.textContent = amplitudeRight;
        }
        
        function drawCoordinateAxis() {
            const axisY = canvas.height / 2;
            ctx.beginPath();
            ctx.moveTo(50, axisY);
            ctx.lineTo(canvas.width - 50, axisY);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
            const tickCount = 11;
            for (let i = 0; i < tickCount; i++) {
                const x = 50 + (i / (tickCount - 1)) * (canvas.width - 100);
                ctx.beginPath();
                ctx.moveTo(x, axisY - 5);
                ctx.lineTo(x, axisY + 5);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(i.toString(), x, axisY + 20);
            }
            ctx.textAlign = 'left';
        }
        
        function getLeftWaveDisplacement(x, t) {
            if (!leftWaveActive) return 0;
            const distanceFromLeft = x - leftSourceX;
            if (distanceFromLeft < 0) return 0;
            const waveTravelTime = distanceFromLeft / waveSpeed;
            const effectiveTime = t - leftStartTime - waveTravelTime;
            if (effectiveTime < 0) return 0;
            return leftDirection * amplitudeLeft * Math.sin(2 * Math.PI * frequency * effectiveTime);
        }
        
        function getRightWaveDisplacement(x, t) {
            if (!rightWaveActive) return 0;
            const distanceFromRight = rightSourceX - x;
            if (distanceFromRight < 0) return 0;
            const waveTravelTime = distanceFromRight / waveSpeed;
            const effectiveTime = t - rightStartTime - waveTravelTime;
            if (effectiveTime < 0) return 0;
            return rightDirection * amplitudeRight * Math.sin(2 * Math.PI * frequency * effectiveTime);
        }
        
        function isInInterferenceRegion(x, t) {
            if (!leftWaveActive || !rightWaveActive) return false;
            const leftWaveArrived = x <= leftSourceX + waveSpeed * (t - leftStartTime);
            const rightWaveArrived = x >= rightSourceX - waveSpeed * (t - rightStartTime);
            return leftWaveArrived && rightWaveArrived;
        }
        
        function drawParticles(currentTime) {
            const drawTime = currentTime !== undefined ? currentTime : time;
            for (let i = 1; i < particles.length; i++) {
                const prevParticle = particles[i - 1];
                const particle = particles[i];
                const prevX = prevParticle.x;
                const x = particle.x;
                const prevLeftDisplacement = getLeftWaveDisplacement(prevX, drawTime);
                const prevRightDisplacement = getRightWaveDisplacement(prevX, drawTime);
                const prevDisplacement = prevLeftDisplacement + prevRightDisplacement;
                const leftDisplacement = getLeftWaveDisplacement(x, drawTime);
                const rightDisplacement = getRightWaveDisplacement(x, drawTime);
                const displacement = leftDisplacement + rightDisplacement;
                const prevInInterference = isInInterferenceRegion(prevX, drawTime);
                const inInterference = isInInterferenceRegion(x, drawTime);
                let lineColor = '#7f8c8d';
                if (prevInInterference && inInterference) {
                    if (showInterference) {
                        lineColor = '#2ecc71';
                    } else {
                        continue;
                    }
                } else {
                    if (leftWaveActive && !rightWaveActive) {
                        if (showLeftWave) {
                            lineColor = '#ff9f43';
                        } else {
                            continue;
                        }
                    } else if (!leftWaveActive && rightWaveActive) {
                        if (showRightWave) {
                            lineColor = '#54a0ff';
                        } else {
                            continue;
                        }
                    } else if (leftWaveActive && rightWaveActive) {
                        const leftWaveFront = leftSourceX + waveSpeed * (drawTime - leftStartTime);
                        const rightWaveFront = rightSourceX - waveSpeed * (drawTime - rightStartTime);
                        if (prevX < leftWaveFront && x < leftWaveFront) {
                            if (showLeftWave) {
                                lineColor = '#ff9f43';
                            } else {
                                continue;
                            }
                        } else if (prevX > rightWaveFront && x > rightWaveFront) {
                            if (showRightWave) {
                                lineColor = '#54a0ff';
                            } else {
                                continue;
                            }
                        } else {
                            continue;
                        }
                    } else {
                        continue;
                    }
                }
                ctx.beginPath();
                ctx.moveTo(prevX, prevParticle.originalY - prevDisplacement);
                ctx.lineTo(x, particle.originalY - displacement);
                ctx.strokeStyle = lineColor;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            particles.forEach((particle) => {
                const x = particle.x;
                let displacement = 0;
                if (leftWaveActive || rightWaveActive) {
                    const leftDisplacement = getLeftWaveDisplacement(x, drawTime);
                    const rightDisplacement = getRightWaveDisplacement(x, drawTime);
                    displacement = leftDisplacement + rightDisplacement;
                }
                let shouldDrawParticle = false;
                let particleColor = '#7f8c8d';
                const inInterference = isInInterferenceRegion(x, drawTime);
                if (inInterference) {
                    if (showInterference) {
                        shouldDrawParticle = true;
                        particleColor = '#2ecc71';
                    }
                } else {
                    if (leftWaveActive && !rightWaveActive) {
                        if (showLeftWave) {
                            shouldDrawParticle = true;
                            particleColor = '#ff9f43';
                        }
                    } else if (!leftWaveActive && rightWaveActive) {
                        if (showRightWave) {
                            shouldDrawParticle = true;
                            particleColor = '#54a0ff';
                        }
                    } else if (leftWaveActive && rightWaveActive) {
                        const leftWaveFront = leftSourceX + waveSpeed * (drawTime - leftStartTime);
                        const rightWaveFront = rightSourceX - waveSpeed * (drawTime - rightStartTime);
                        if (x < leftWaveFront) {
                            if (showLeftWave) {
                                shouldDrawParticle = true;
                                particleColor = '#ff9f43';
                            }
                        } else if (x > rightWaveFront) {
                            if (showRightWave) {
                                shouldDrawParticle = true;
                                particleColor = '#54a0ff';
                            }
                        } else {
                            shouldDrawParticle = true;
                        }
                    } else {
                        shouldDrawParticle = true;
                    }
                }
                if (shouldDrawParticle) {
                    ctx.beginPath();
                    ctx.arc(x, particle.originalY - displacement, 4, 0, Math.PI * 2);
                    ctx.fillStyle = particleColor;
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });
        }
        
        function drawWave(currentTime) {
            const drawTime = currentTime !== undefined ? currentTime : time;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawCoordinateAxis();
            drawParticles(drawTime);
            if (leftWaveActive && showLeftWave) {
                ctx.strokeStyle = '#ff9f43';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 3]);
                ctx.beginPath();
                const leftWaveFront = leftSourceX + waveSpeed * (drawTime - leftStartTime);
                let startedDrawing = false;
                for (let x = 0; x <= Math.min(canvas.width, leftWaveFront); x++) {
                    const y = canvas.height / 2 - getLeftWaveDisplacement(x, drawTime);
                    if (!startedDrawing) {
                        ctx.moveTo(x, y);
                        startedDrawing = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
            }
            if (rightWaveActive && showRightWave) {
                ctx.strokeStyle = '#54a0ff';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 3]);
                ctx.beginPath();
                const rightWaveFront = rightSourceX - waveSpeed * (drawTime - rightStartTime);
                let startedDrawing = false;
                for (let x = Math.max(0, rightWaveFront); x <= canvas.width; x++) {
                    const y = canvas.height / 2 - getRightWaveDisplacement(x, drawTime);
                    if (!startedDrawing) {
                        ctx.moveTo(x, y);
                        startedDrawing = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
            }
            ctx.setLineDash([]);
        }
        
        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        
        function animate() {
            if (!isPaused) {
                time += 1/80;
                if (time > maxTime) {
                    maxTime = Math.ceil(time);
                    frameSlider.max = maxTime;
                }
                frameSlider.value = time;
                manualTime = time;
            }
            if (isPaused) {
                drawWave(manualTime);
            } else {
                drawWave();
            }
            updateStatus();
            animationId = requestAnimationFrame(animate);
        }
        
        function updateStatus() {
            let statusText = "";
            if (isPaused) {
                statusText += "已暂停";
                if (leftWaveActive || rightWaveActive) {
                    statusText += ` | 时间: ${manualTime.toFixed(2)}s`;
                }
            } else {
                statusText += "播放中";
            }
            if (leftWaveActive && rightWaveActive) {
                statusText += ` | 两列波干涉中`;
                if (showInterference) {
                    statusText += ` | 干涉波已显示`;
                } else {
                    statusText += ` | 干涉波已隐藏`;
                }
            } else if (leftWaveActive) {
                statusText += ` | 左波源振动中`;
                if (!showLeftWave) {
                    statusText += ` | 左波已隐藏`;
                }
            } else if (rightWaveActive) {
                statusText += ` | 右波源振动中`;
                if (!showRightWave) {
                    statusText += ` | 右波已隐藏`;
                }
            } else {
                statusText += " | 点击按钮开始模拟";
            }
            statusText += ` | 左波: ${leftDirection > 0 ? '向上' : '向下'} | 右波: ${rightDirection > 0 ? '向上' : '向下'}`;
            status.textContent = statusText;
        }
        
        function startLeftWave() {
            leftWaveActive = true;
            leftStartTime = time;
            sourceLeft.style.boxShadow = "0 0 15px #ff9f43, 0 0 20px #ff9f43";
            sourceLeft.style.transform = "translate(-50%, -50%) scale(1.15)";
            updateStatus();
        }
        
        function startRightWave() {
            rightWaveActive = true;
            rightStartTime = time;
            sourceRight.style.boxShadow = "0 0 15px #54a0ff, 0 0 20px #54a0ff";
            sourceRight.style.transform = "translate(-50%, -50%) scale(1.15)";
            updateStatus();
        }
        
        function startBothWaves() {
            leftWaveActive = true;
            rightWaveActive = true;
            leftStartTime = time;
            rightStartTime = time;
            sourceLeft.style.boxShadow = "0 0 15px #ff9f43, 0 0 20px #ff9f43";
            sourceLeft.style.transform = "translate(-50%, -50%) scale(1.15)";
            sourceRight.style.boxShadow = "0 0 15px #54a0ff, 0 0 20px #54a0ff";
            sourceRight.style.transform = "translate(-50%, -50%) scale(1.15)";
            updateStatus();
        }
        
        function toggleLeftWave() {
            showLeftWave = !showLeftWave;
            toggleLeftWaveBtn.textContent = showLeftWave ? "隐藏左侧波" : "显示左侧波";
        }
        
        function toggleRightWave() {
            showRightWave = !showRightWave;
            toggleRightWaveBtn.textContent = showRightWave ? "隐藏右侧波" : "显示右侧波";
        }
        
        function toggleInterference() {
            showInterference = !showInterference;
            toggleInterferenceBtn.textContent = showInterference ? "隐藏干涉波" : "显示干涉波";
        }
        
        function setLeftDirection(direction) {
            leftDirection = direction;
            if (direction === 1) {
                leftDirectionUpBtn.classList.add('up');
                leftDirectionUpBtn.classList.remove('down');
                leftDirectionDownBtn.classList.remove('up');
                leftDirectionDownBtn.classList.remove('down');
            } else {
                leftDirectionUpBtn.classList.remove('up');
                leftDirectionUpBtn.classList.remove('down');
                leftDirectionDownBtn.classList.remove('up');
                leftDirectionDownBtn.classList.add('down');
            }
        }
        
        function setRightDirection(direction) {
            rightDirection = direction;
            if (direction === 1) {
                rightDirectionUpBtn.classList.add('up');
                rightDirectionUpBtn.classList.remove('down');
                rightDirectionDownBtn.classList.remove('up');
                rightDirectionDownBtn.classList.remove('down');
            } else {
                rightDirectionUpBtn.classList.remove('up');
                rightDirectionUpBtn.classList.remove('down');
                rightDirectionDownBtn.classList.remove('up');
                rightDirectionDownBtn.classList.add('down');
            }
        }
        
        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.textContent = "继续动画";
                pauseBtn.style.backgroundColor = "#2ecc71";
                frameControl.classList.add('active');
                frameSlider.value = time;
                manualTime = time;
            } else {
                pauseBtn.textContent = "暂停动画";
                pauseBtn.style.backgroundColor = "#9b59b6";
                frameControl.classList.remove('active');
                time = manualTime;
            }
            updateStatus();
        }
        
        function onFrameSliderChange() {
            if (isPaused) {
                manualTime = parseFloat(frameSlider.value);
                updateStatus();
            }
        }
        
        function resetSimulation() {
            leftWaveActive = false;
            rightWaveActive = false;
            time = 0;
            leftStartTime = 0;
            rightStartTime = 0;
            isPaused = false;
            showLeftWave = true;
            showRightWave = true;
            showInterference = false;
            manualTime = 0;
            toggleLeftWaveBtn.textContent = "隐藏左侧波";
            toggleRightWaveBtn.textContent = "隐藏右侧波";
            toggleInterferenceBtn.textContent = "显示干涉波";
            pauseBtn.textContent = "暂停动画";
            pauseBtn.style.backgroundColor = "#9b59b6";
            frameSlider.value = 0;
            frameSlider.max = maxTime;
            frameControl.classList.remove('active');
            setLeftDirection(1);
            setRightDirection(1);
            sourceLeft.style.boxShadow = "0 0 10px #ff9f43";
            sourceLeft.style.transform = "translate(-50%, -50%) scale(1)";
            sourceRight.style.boxShadow = "0 0 10px #54a0ff";
            sourceRight.style.transform = "translate(-50%, -50%) scale(1)";
            updateParameterDisplay();
            updateStatus();
            drawWave(0);
        }
        
        frequencySlider.addEventListener('input', function() {
            frequency = parseFloat(this.value);
            updateParameterDisplay();
        });
        
        waveSpeedSlider.addEventListener('input', function() {
            waveSpeed = parseFloat(this.value);
            updateParameterDisplay();
        });
        
        amplitudeLeftSlider.addEventListener('input', function() {
            amplitudeLeft = parseFloat(this.value);
            updateParameterDisplay();
        });
        
        amplitudeRightSlider.addEventListener('input', function() {
            amplitudeRight = parseFloat(this.value);
            updateParameterDisplay();
        });
        
        frameSlider.addEventListener('input', onFrameSliderChange);
        
        startLeftBtn.addEventListener('click', startLeftWave);
        startRightBtn.addEventListener('click', startRightWave);
        startBothBtn.addEventListener('click', startBothWaves);
        toggleLeftWaveBtn.addEventListener('click', toggleLeftWave);
        toggleRightWaveBtn.addEventListener('click', toggleRightWave);
        toggleInterferenceBtn.addEventListener('click', toggleInterference);
        pauseBtn.addEventListener('click', togglePause);
        resetBtn.addEventListener('click', resetSimulation);
        
        leftDirectionUpBtn.addEventListener('click', () => setLeftDirection(1));
        leftDirectionDownBtn.addEventListener('click', () => setLeftDirection(-1));
        rightDirectionUpBtn.addEventListener('click', () => setRightDirection(1));
        rightDirectionDownBtn.addEventListener('click', () => setRightDirection(-1));
        
        updateParameterDisplay();
        setLeftDirection(1);
        setRightDirection(1);
        frameSlider.max = maxTime;
        
        animate();
    </script>
