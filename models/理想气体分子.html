<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>理想气体微观机制实验室 · 增强可视化</title>
    <style>
        :root {
            --primary: #00f2ff;
            --accent: #facc15;
            --danger: #ff2d55;
            --bg: #0b0f1a;
            --panel-bg: rgba(20, 30, 48, 0.95);
            --glass-border: rgba(255, 255, 255, 0.2);
            --font-mono: 'JetBrains Mono', 'Orbitron', monospace;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 30%, #161e2e 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #0d121f 0%, transparent 40%);
            color: #e2e8f0;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .side-panel {
            width: 380px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 10px 0 40px rgba(0,0,0,0.8);
        }

        h1 {
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
            margin: 0 0 5px 0;
        }

        .version-tag { font-size: 11px; color: #475569; letter-spacing: 1px; margin-bottom: 30px; }

        .process-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }

        .process-btn {
            flex: 1;
            padding: 12px 5px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            color: #64748b;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 6px;
        }

        .process-btn.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.4);
            border-color: var(--primary);
        }

        .stat-card {
            background: #000;
            border-radius: 12px;
            padding: 24px 20px;
            margin-bottom: 30px;
            border: 1px solid #1e293b;
            box-shadow: inset 0 0 20px rgba(0,0,0,1), 0 4px 14px rgba(0,242,255,0.1);
        }

        .stat-item { margin: 18px 0; }
        .stat-label { 
            display: block; 
            font-size: 14px; 
            color: #cbd5e6; 
            text-transform: uppercase; 
            margin-bottom: 6px; 
            letter-spacing: 1px;
            font-weight: 500;
        }
        /* 数值字体显著增大 + 高亮霓虹效果 */
        .stat-value { 
            font-family: var(--font-mono); 
            color: #0ff; 
            font-size: 48px; 
            font-weight: 800; 
            line-height: 1; 
            text-shadow: 0 0 12px #0ff, 0 0 25px rgba(0, 255, 255, 0.4);
            letter-spacing: 2px;
        }
        .unit { 
            font-size: 20px; 
            margin-left: 8px; 
            color: #7f8ea3; 
            font-weight: 500;
            text-shadow: none;
        }

        .input-group { margin-bottom: 35px; }
        .input-group label { 
            display: block; 
            font-size: 18px; 
            color: #facc15; 
            margin-bottom: 12px; 
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 0 4px rgba(250, 204, 21, 0.3);
        }

        /* 滑动条整体强化：更高、更亮、滑块更醒目 */
        input[type="range"] {
            width: 100%; 
            height: 8px; 
            background: #1e293b; 
            border-radius: 8px; 
            appearance: none; 
            outline: none;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 0 6px rgba(0,242,255,0.2);
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none; 
            width: 26px; 
            height: 26px; 
            background: #facc15; 
            border-radius: 50%; 
            cursor: pointer;
            box-shadow: 0 0 15px #facc15, 0 0 6px white; 
            border: 2px solid #ffffff;
            transition: 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.18);
            background: #ffdf6e;
        }
        /* 针对Firefox的样式提升 */
        input[type="range"]::-moz-range-thumb {
            width: 26px;
            height: 26px;
            background: #facc15;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 0 12px #facc15;
        }
        input[type="range"]::-moz-range-track {
            height: 8px;
            background: #1e293b;
            border-radius: 8px;
        }

        .formula { margin-top: auto; padding: 20px; background: rgba(0, 242, 255, 0.03); border: 1px solid rgba(0, 242, 255, 0.1); border-radius: 8px; font-size: 13px; line-height: 1.6; color: #94a3b8; }
        .formula b { color: var(--primary); }

        .canvas-area { 
            flex: 1; 
            position: relative; 
            background: #020617; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            display: block; 
        }
        
        /* 右上角图片容器：默认隐藏，无任何视觉样式 */
        .image-corner {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            height: auto;
            display: none;          /* 默认隐藏，只有设置了有效图片 src 后才显示 */
            z-index: 20;
        }
        .image-corner img {
            width: 100%;
            height: auto;
            object-fit: contain;    /* 完整显示不变形 */
            display: block;
        }
        
        /* 重置按钮略微提升质感 */
        button {
            transition: all 0.2s ease;
        }
        button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <aside class="side-panel">
        <h1>理想气体微观模型</h1>
      
        <div class="process-selector">
            <button class="process-btn active" onclick="setProcess('T')">等温 T</button>
            <button class="process-btn" onclick="setProcess('V')">等容 V</button>
            <button class="process-btn" onclick="setProcess('P')">等压 P</button>
        </div>

        <div class="stat-card">
            <div class="stat-item"><span class="stat-label">压强 Pressure</span><span class="stat-value" id="valP">1.00</span><span class="unit">atm</span></div>
            <div class="stat-item"><span class="stat-label">体积 Volume</span><span class="stat-value" id="valV">1.00</span><span class="unit">L</span></div>
            <div class="stat-item"><span class="stat-label">温度 Temperature</span><span class="stat-value" id="valT">300</span><span class="unit">K</span></div>
        </div>

        <div class="input-group" id="ctrlV">
            <label>🔧 活塞高度调节 (Volume)</label>
            <input type="range" id="sliderV" min="0.3" max="2.4" step="0.01" value="1.0">
        </div>

        <div class="input-group" id="ctrlT">
            <label>🔥 温度调节 (Temperature)</label>
            <input type="range" id="sliderT" min="100" max="900" step="1" value="300">
        </div>


        <button onclick="resetParticles()" style="margin-top: 25px; padding: 12px; background: rgba(255, 45, 85, 0.1); border: 1px solid var(--danger); color: var(--danger); cursor: pointer; border-radius: 6px; font-size: 12px; font-weight: bold;">⟳ 重置粒子</button>
    </aside>

    <div class="canvas-area">
        <canvas id="gasCanvas"></canvas>
        <!-- 右上角图片容器：无任何装饰，默认隐藏，只有设置了图片 src 并手动显示后才可见 -->
        <div class="image-corner" id="imageCorner">
            <img src="" alt="右上角图示" id="cornerImage">
        </div>
    </div>

<script>
    // ========== 修复原生 roundRect 缺失 ==========
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            return this;
        };
    }

    const canvas = document.getElementById('gasCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    let state = {
        processType: 'T', P: 1.0, V: 1.0, T: 300, vV: 0, n: 80, timeScale: 1.0
    };

    let particles = [];
    const containerBaseH = 520; 
    const containerW = 320;    
    const unitH = 200;         
    const MAX_V_LIMIT = (containerBaseH - 30) / unitH;

    class Particle {
        constructor() { this.r = 3.8; this.reset(); }
        reset() {
            const centerX = canvas.width / (2 * dpr);
            const centerY = canvas.height / (2 * dpr);
            const bottomY = centerY + 180;
            const currentH = unitH * state.V;
            this.x = centerX - containerW/2 + Math.random() * containerW;
            this.y = bottomY - Math.random() * currentH;
            this.setSpeedAndColor();
            const angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(angle) * this.speed;
            this.vy = Math.sin(angle) * this.speed;
        }
        setSpeedAndColor() {
            this.speed = Math.sqrt(state.T) * 0.18;
            const currentAngle = Math.atan2(this.vy, this.vx);
            this.vx = Math.cos(currentAngle) * this.speed;
            this.vy = Math.sin(currentAngle) * this.speed;
            const tRatio = (state.T - 100) / 800;
            const hue = 220 - (tRatio * 220); 
            this.color = `hsla(${hue}, 100%, 65%, 1)`;
            this.glowColor = `hsla(${hue}, 100%, 50%, 0.4)`;
        }
        update(dt, bounds) {
            this.x += this.vx * dt; this.y += this.vy * dt;
            if (this.x - this.r < bounds.left) { this.x = bounds.left + this.r; this.vx *= -1; }
            if (this.x + this.r > bounds.right) { this.x = bounds.right - this.r; this.vx *= -1; }
            if (this.y + this.r > bounds.bottom) { this.y = bounds.bottom - this.r; this.vy *= -1; }
            if (this.y - this.r < bounds.top) { this.y = bounds.top + this.r; this.vy *= -1; }
        }
        draw() {
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 2.2, 0, Math.PI * 2);
            ctx.fillStyle = this.glowColor; ctx.fill();
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fillStyle = this.color; ctx.fill();
        }
    }

    function init() {
        resize();
        for (let i = 0; i < state.n; i++) particles.push(new Particle());
        updateControls();
        animate();
        
        // ===== 设置图片示例 =====
        // 将您的图片文件（如 logo.png）与 .html 文件放在同一目录下，
        // 取消下面两行注释，并将 "your-image.png" 改为实际文件名
        
        const imgElement = document.getElementById('cornerImage');
        const cornerContainer = document.getElementById('imageCorner');
        imgElement.src = "5.png";
        imgElement.onload = () => { cornerContainer.style.display = 'block'; };
        imgElement.onerror = () => { cornerContainer.style.display = 'none'; };
        
    }

    function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
    }

    function setProcess(type) {
        state.processType = type; state.vV = 0;
        document.querySelectorAll('.process-btn').forEach(btn => btn.classList.toggle('active', btn.innerText.includes(type)));
        updateControls();
    }

    function updateControls() {
        document.getElementById('ctrlV').style.opacity = (state.processType === 'T') ? '1' : '0.4';
        document.getElementById('ctrlV').style.pointerEvents = (state.processType === 'T') ? 'auto' : 'none';
        document.getElementById('ctrlT').style.opacity = (state.processType !== 'T') ? '1' : '0.4';
        document.getElementById('ctrlT').style.pointerEvents = (state.processType !== 'T') ? 'auto' : 'none';
    }

    function physicsUpdate() {
        const sV = parseFloat(document.getElementById('sliderV').value);
        const sT = parseFloat(document.getElementById('sliderT').value);
        let targetV = state.V;
        if (state.processType === 'T') {
            targetV = sV; 
            state.P = (state.T * 0.0033) / targetV; 
            state.V += (targetV - state.V) * 0.15;
        } else if (state.processType === 'V') {
            state.V = 1.0; 
            state.T = sT; 
            state.P = (state.T * 0.0033) / state.V;
        } else if (state.processType === 'P') {
            state.T = sT; 
            const targetVolume = (state.T * 0.0033) / 1.0;
            const smoothFactor = 0.008;
            state.V = state.V + (targetVolume - state.V) * smoothFactor;
            state.P = 1.0;
        }
        state.V = Math.min(state.V, MAX_V_LIMIT);
        document.getElementById('valP').innerText = state.P.toFixed(2);
        document.getElementById('valV').innerText = state.V.toFixed(2);
        document.getElementById('valT').innerText = state.T.toFixed(0);

        const centerX = canvas.width / (2 * dpr);
        const centerY = canvas.height / (2 * dpr);
        const bottomY = centerY + 180;
        const bounds = { left: centerX - containerW/2, right: centerX + containerW/2, bottom: bottomY, top: bottomY - unitH * state.V };
        particles.forEach(p => { p.setSpeedAndColor(); p.update(1, bounds); });
        return bounds;
    }

    function render(bounds) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerX = canvas.width / (2 * dpr);
        const centerY = canvas.height / (2 * dpr);
        const bottomY = centerY + 180;

        const bgGrad = ctx.createLinearGradient(bounds.left, 0, bounds.right, 0);
        bgGrad.addColorStop(0, 'rgba(255,255,255,0.02)');
        bgGrad.addColorStop(0.5, 'rgba(255,255,255,0.06)');
        bgGrad.addColorStop(1, 'rgba(255,255,255,0.02)');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(bounds.left, bottomY - containerBaseH, containerW, containerBaseH);

        ctx.lineWidth = 8;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.strokeRect(bounds.left - 4, bottomY - containerBaseH, containerW + 8, containerBaseH + 4);

        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.moveTo(bounds.left + 5, bottomY); ctx.lineTo(bounds.left + 5, bottomY - containerBaseH);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.moveTo(bounds.right - 5, bottomY); ctx.lineTo(bounds.right - 5, bottomY - containerBaseH);
        ctx.stroke();

        ctx.fillStyle = '#475569';
        ctx.fillRect(centerX - 6, bounds.top - 200, 12, 200);
        const pGrad = ctx.createLinearGradient(bounds.left, 0, bounds.right, 0);
        pGrad.addColorStop(0, '#1e293b'); pGrad.addColorStop(0.5, '#f8fafc'); pGrad.addColorStop(1, '#1e293b');
        ctx.fillStyle = pGrad;
        ctx.beginPath(); 
        ctx.roundRect(bounds.left + 2, bounds.top - 15, containerW - 4, 20, 4); 
        ctx.fill();

        if (state.processType === 'V') {
            ctx.fillStyle = '#b87333';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.roundRect(bounds.left - 12, bounds.top - 18, 24, 10, 2);
            ctx.fill();
            ctx.fillRect(bounds.left - 12, bounds.top - 18, 6, 25);
            ctx.beginPath();
            ctx.roundRect(bounds.right - 12, bounds.top - 18, 24, 10, 2);
            ctx.fill();
            ctx.fillRect(bounds.right + 6, bounds.top - 18, 6, 25);
            ctx.shadowBlur = 0;
        }

        particles.forEach(p => p.draw());

        const arrowCount = 5;
        const spacing = containerW / (arrowCount + 1);
        const len = 15 + state.P * 25;
        ctx.strokeStyle = `rgba(255, 230, 0, ${0.4 + state.P * 0.5})`;
        ctx.lineWidth = 4;
        for(let i=1; i<=arrowCount; i++) {
            const x = bounds.left + i * spacing;
            drawArrow(x, bounds.bottom - 2, x, bounds.bottom + len);
            drawArrow(x, bounds.top + 2, x, bounds.top - len);
        }
    }

    function drawArrow(x1, y1, x2, y2) {
        const head = 10; 
        const angle = Math.atan2(y2 - y1, x2 - x1);
        ctx.beginPath(); 
        ctx.moveTo(x1, y1); 
        ctx.lineTo(x2, y2);
        ctx.lineTo(x2 - head * Math.cos(angle - 0.5), y2 - head * Math.sin(angle - 0.5));
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - head * Math.cos(angle + 0.5), y2 - head * Math.sin(angle + 0.5));
        ctx.stroke();
    }

    function animate() { 
        const bounds = physicsUpdate(); 
        render(bounds); 
        requestAnimationFrame(animate); 
    }
    
    function resetParticles() { 
        particles.forEach(p => p.reset()); 
    }
    
    window.addEventListener('resize', () => {
        resize();
        particles.forEach(p => p.reset());
    });
    
    document.getElementById('sliderV').addEventListener('input', (e) => {});
    document.getElementById('sliderT').addEventListener('input', (e) => {});
    
    init();
</script>
</body>
</html>
