<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physic_Lab</title>
    <style>
        /* 你的原有样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #0c0f14;
            color: #fff;
            padding: 40px 30px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 500;
            background: linear-gradient(to right, #ffffff, #b0e0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 搜索框样式 */
        .search-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 12px;
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #00c8ff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.2);
        }

        .stats {
            background: rgba(20,30,40,0.6);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #ccddee;
            white-space: nowrap;
        }

        /* 快速导航样式 */
        .quick-nav {
            margin-bottom: 40px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #aae0ff;
            text-decoration: none;
            transition: 0.3s;
        }

        .nav-tag:hover {
            background: rgba(0, 200, 255, 0.1);
            border-color: rgba(0, 200, 255, 0.3);
        }

        .section {
            margin-bottom: 50px;
            scroll-margin-top: 40px; /* 锚点跳转留白 */
        }

        .section-title {
            display: flex;
            align-items: baseline;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(0,200,255,0.3);
        }

        .section-name {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #aaddff, #88ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: 15px;
        }

        .section-count {
            background: rgba(0,200,255,0.1);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.9rem;
            color: #aae0ff;
            border: 1px solid rgba(0,200,255,0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            background-color: #1a1e24;
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.2, 0, 0, 1);
            cursor: pointer;
            aspect-ratio: 1 / 1.2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 预留模型样式：变灰、模糊 */
        .card.coming-soon {
            filter: grayscale(0.9) brightness(0.7);
            cursor: default;
        }

        .coming-soon-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 159, 67, 0.9);
            color: #000;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            z-index: 4;
            letter-spacing: 1px;
        }

        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.6s ease;
            z-index: 1;
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, 
                        rgba(0,0,0,0.2) 0%, 
                        rgba(0,0,0,0.6) 70%, 
                        rgba(0,0,0,0.85) 100%);
            z-index: 2;
        }

        .card-content {
            position: relative;
            z-index: 3;
            padding: 28px 22px;
            color: white;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .card-title {
            font-size: 1.7rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .card-desc {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 15px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-tag {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.9);
            border: 1px solid rgba(255,255,255,0.2);
            text-transform: uppercase;
        }

        .card:not(.coming-soon):hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 40px -12px rgba(0,150,255,0.3);
            border-color: rgba(100,200,255,0.3);
        }

        .card:hover .card-bg {
            transform: scale(1.08);
        }

        .card:hover .card-content {
            transform: translateY(-5px);
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #8899aa;
            background: rgba(255,255,255,0.02);
            border-radius: 30px;
            border: 1px dashed rgba(255,255,255,0.1);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: #5f6c7a;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>物理仿真实验室</h1>
            <div class="search-wrapper">
                <input type="text" class="search-input" id="search-bar" placeholder="搜索实验名称、描述或标签...">
            </div>
            <div class="stats" id="total-count">加载中...</div>
        </div>

        <div class="quick-nav" id="quick-nav"></div>

        <div id="sections-container"></div>

        <div class="footer"></div>
    </div>

    <script>
        // ---------- 模型库配置 ----------
        const models = [
            // 必修一
            {
                file: "models/匀变速直线运动.html",
                title: "匀变速直线运动",
                desc: "速度 / 位移 / 时间关系",
                bgImage: "./images/motion.jpg",
                tag: "运动学",
                category: "必修一",
status: "coming-soon" 
            },
            {
                file: "models/自由落体.html",
                title: "自由落体",
                desc: "重力加速度模拟",
                bgImage: "",
                tag: "运动学",
                category: "必修一",
                status: "coming-soon" // ✨ 预留示例
            },
            // 必修二
            {
                file: "models/平抛运动.html",
                title: "平抛运动",
                desc: "水平/竖直分量合成",
                bgImage: "./images/projectile.jpg",
                tag: "曲线运动",
                category: "必修二",
status: "coming-soon" 
            },
            {
                file: "models/圆周运动.html",
                title: "圆周运动",
                desc: "向心力 / 角速度",
                bgImage: "",
                tag: "曲线运动",
                category: "必修二",
                status: "coming-soon"
            },
            // 必修三
            {
                file: "models/电流的磁效应/电流的磁效应.html",
                title: "通电长直导线产生的磁场",
                desc: "通电导线/磁感线/ 磁场分布",
                bgImage: "./images/电流的磁效应.png",
                tag: "电磁学",
                category: "必修三"
            },
            // 选择性必修一
            {
                file: "models/双缝干涉3.html",
                title: "杨氏双缝干涉",
                desc: "波长 / 缝距 / 屏距可调，动态条纹",
                bgImage: "./images/double-slit.png",
                tag: "光学 · 干涉",
                category: "选择性必修一"
            },
            {
                file: "models/波的干涉.html",
                title: "机械波的干涉",
                desc: "波长 / 频率 / 振幅可调",
                bgImage: "./images/波的干涉.png",
                tag: "机械波",
                category: "选择性必修一"
            },
            // 选择性必修二
            {
                file: "models/质谱仪.html",
                title: "质谱仪",
                desc: "洛伦兹力与现代科技",
                bgImage: "./images/质谱仪.png",
                tag: "洛伦兹力/同位素分离",
                category: "选择性必修二"
            },
            {
                file: "models/回旋加速器.html",
                title: "回旋加速器",
                desc: "洛伦兹力与现代科技",
                bgImage: "./images/回旋加速器.png",
                tag: "洛伦兹力/高能粒子/粒子加速",
                category: "选择性必修二"
            },
            {
                file: "models/电磁流量计.html",
                title: "电磁流量计",
                desc: "洛伦兹力与现代科技",
                bgImage: "./images/电磁流量计.png",
                tag: "洛伦兹力/电场力",
                category: "选择性必修二"
            },
 {
                file: "models/速度选择器.html",
                title: "速度选择器",
                desc: "洛伦兹力与现代科技",
                bgImage: "./images/速度选择器.png",
                tag: "洛伦兹力/电场力",
                category: "选择性必修二"
            },
 {
                file: "models/带电粒子在匀强磁场中的运动.html",
                title: "带电粒子在匀强磁场中的运动",
                desc: "带电粒子在匀强磁场中的运动",
                bgImage: "./images/带电粒子在匀强磁场中的运动.png",
                tag: "洛伦兹力",
                category: "选择性必修二"
            },
            // 选择性必修三
           {
                file: "models/布朗运动.html",
                title: "布朗运动",
                desc: "分子热运动/分子动理论",
                bgImage: "./images/布朗运动.png",
                tag: "布朗运动",
                category: "选择性必修三"
            },
            {
                file: "models/光电效应.html",
                title: "光电效应",
                desc: "光电效应/截止频率",
                bgImage: "./images/光电效应.png",
                tag: "光电效应",
                category: "选择性必修三"
            },
 {
                file: "models/光电管实验/遏止电压和饱和电流.html",
                title: "遏止电压和饱和电流",
                desc: "光电效应/遏止电压和饱和电流",
                bgImage: "./images/光电管实验.png",
                tag: "光电效应",
                category: "选择性必修三"
            },

{
                file: "models/衰变.html",
                title: "粒子在磁场中的衰变",
                desc: "α衰变 /β衰变 / 磁场",
                bgImage: "./images/衰变.png",
                tag: "量子物理",
                category: "选择性必修三"
            },
            {
                file: "models/氢原子光谱.html",
                title: "氢原子光谱",
                desc: "玻尔原子理论/轨道量子化/能级跃迁",
                bgImage: "./images/氢原子光谱.png",
                tag: "原子结构/波粒二象性",
                category: "选择性必修三"
            },
        ];

        const categories = ["必修一", "必修二", "必修三", "选择性必修一", "选择性必修二", "选择性必修三"];

        function groupByCategory(filteredModels) {
            const groups = {};
            categories.forEach(cat => { groups[cat] = []; });
            filteredModels.forEach(model => {
                const cat = model.category;
                if (groups[cat]) groups[cat].push(model);
                else {
                    if (!groups["其他"]) groups["其他"] = [];
                    groups["其他"].push(model);
                }
            });
            return groups;
        }

        function renderCard(model) {
            const isComing = model.status === 'coming-soon';
            const clickAction = isComing ? "" : `onclick="window.open('${model.file}', '_blank')"`;
            
            let bgStyle = '';
            if (model.bgImage) {
                bgStyle = `background-image: url('${model.bgImage}');`;
            } else {
                const gradients = [
                    'linear-gradient(145deg, #0f2027, #203a43, #2c5364)',
                    'linear-gradient(145deg, #1d2671, #5c2580)',
                    'linear-gradient(145deg, #134e5e, #71b280)',
                    'linear-gradient(145deg, #373b44, #4286f4)'
                ];
                bgStyle = `background-image: ${gradients[Math.floor(Math.random() * gradients.length)]};`;
            }

            return `
                <div class="card ${isComing ? 'coming-soon' : ''}" ${clickAction}>
                    ${isComing ? '<div class="coming-soon-badge">即将上线</div>' : ''}
                    <div class="card-bg" style="${bgStyle}"></div>
                    <div class="card-overlay"></div>
                    <div class="card-content">
                        <div class="card-title">${model.title}</div>
                        <div class="card-desc">${model.desc || '交互式物理仿真'}</div>
                        <span class="card-tag">${model.tag || model.category}</span>
                    </div>
                </div>
            `;
        }

        function renderAllSections(filterText = '') {
            const container = document.getElementById('sections-container');
            const navContainer = document.getElementById('quick-nav');
            
            // 过滤逻辑
            const filtered = models.filter(m => 
                m.title.toLowerCase().includes(filterText.toLowerCase()) || 
                m.desc.toLowerCase().includes(filterText.toLowerCase()) ||
                m.tag.toLowerCase().includes(filterText.toLowerCase())
            );

            const groups = groupByCategory(filtered);
            let totalModelCount = filtered.length;
            let html = '';
            let navHtml = '';

            categories.forEach((cat, index) => {
                const catModels = groups[cat] || [];
                if (catModels.length === 0) return;

                const sectionId = `section-${index}`;
                navHtml += `<a href="#${sectionId}" class="nav-tag">${cat}</a>`;

                let cardsHtml = catModels.map(renderCard).join('');

                html += `
                    <div class="section" id="${sectionId}">
                        <div class="section-title">
                            <span class="section-name">${cat}</span>
                            <span class="section-count">${catModels.length} 个实验</span>
                        </div>
                        <div class="grid">${cardsHtml}</div>
                    </div>
                `;
            });

            navContainer.innerHTML = navHtml;
            container.innerHTML = html || '<div class="empty">🔍 没有找到匹配的实验</div>';
            document.getElementById('total-count').textContent = `共 ${totalModelCount} 个模型`;
        }

        // 搜索监听
        document.getElementById('search-bar').addEventListener('input', (e) => {
            renderAllSections(e.target.value);
        });

        renderAllSections();
    </script>
</body>
</html>
